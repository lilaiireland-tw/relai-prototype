name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Repository quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_API_KEY: ''
      CF_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      GOOGLE_API_KEY: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      GEMINI_API_KEY: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Confirm remote credentials are absent
        run: node scripts/assert-no-remote-credentials.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_API_KEY: ''
      CF_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      GOOGLE_API_KEY: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      GEMINI_API_KEY: ''
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Confirm remote credentials are absent
        run: node scripts/assert-no-remote-credentials.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run isolated local browser tests
        run: npm run test:e2e

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-diagnostics
          path: |
            playwright-report/
            test-results/**/trace.zip
            test-results/**/attachments/trace-*.zip
            test-results/**/*.png
          retention-days: 7
